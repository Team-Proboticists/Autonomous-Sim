global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.03
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint

      robot_radius: 0.22
      resolution: 0.05

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /projected_map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        transform_tolerance: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 1.0

      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: camera_init
      robot_base_frame: base_footprint

      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      robot_radius: 0.22

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true

        origin_z: -1.0
        z_resolution: 0.1
        z_voxels: 20
        max_obstacle_height: 2.0

        observation_sources: pointcloud
        pointcloud:
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Robot motion limits
      desired_linear_vel: 0.22
      max_linear_accel: 2.5
      max_angular_accel: 3.2

      # Lookahead behavior
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5

      # Goal handling
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.0
      rotate_to_goal_heading: true

      # Obstacle regulation
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      inflation_cost_scaling_factor: 3.0

      # Path handling
      allow_reversing: false

planner_server:
  ros__parameters:
    use_sim_time: true

    planner_plugins: ["GridBased"]

    HybridAStar:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # Planning behavior
      tolerance: 3.0
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0

      # Motion model (DIFF DRIVE)
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 0.4

      # Path quality
      smooth_path: true
      downsample_costmap: false

      # Cost penalties
      cost_penalty: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2

      # Heuristic
      use_heuristic: true
      lookup_table_size: 20.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: camera_init
    robot_base_frame: base_footprint

bt_navigator:
  ros__parameters:
    default_bt_xml_filename: "navigate_w_replanning_only_if_path_becomes_invalid.xml"